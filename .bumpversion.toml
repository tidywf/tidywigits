[tool.bumpversion]
current_version = "0.1.0.9000"
search = "{current_version}"
replace = "{new_version}"
message = "Bump version: {current_version} => {new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
commit = false
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:\\.(?P<dev>\\d+))?
"""

serialize = [
    "{major}.{minor}.{patch}.{dev}",
    "{major}.{minor}.{patch}",
]

[[tool.bumpversion.files]]
filename = "DESCRIPTION"
search = "Version: {current_version}"
replace = "Version: {new_version}"

[[tool.bumpversion.files]]
filename = "deploy/conda/recipe/recipe.yaml"
search = "version: {current_version}"
replace = "version: {new_version}"

[[tool.bumpversion.files]]
filename = "deploy/conda/env/yaml/tidywigits.yaml"
search = "r-tidywigits =={current_version}"
replace = "r-tidywigits =={new_version}"

[[tool.bumpversion.files]]
filename = "deploy/conda/env/yaml/pkgdown.yaml"
search = "r-tidywigits =={current_version}"
replace = "r-tidywigits =={new_version}"

[[tool.bumpversion.files]]
filename = "docker-compose.yaml"
search = "tidywigits:${{IMAGE_TAG:-{current_version}}}"
replace = "tidywigits:${{IMAGE_TAG:-{new_version}}}"

