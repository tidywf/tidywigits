name: conda-docker-docs

on:
  push:
    tags:
      # 3-part main (vX.Y.Z) and 4-part dev (vX.Y.Z.9XXX) releases only.
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"

jobs:
  prep:
    name: 📋 Version
    runs-on: ubuntu-latest
    outputs:
      pkg_version: ${{ steps.v.outputs.pkg_version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Expected tag of the form vX.Y.Z or vX.Y.Z.9XXX, got '$GITHUB_REF_NAME'" >&2
            exit 1
          fi
          echo "pkg_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  condarise:
    name: 🐍 Condarise
    needs: [prep]
    uses: tidywf/actions/.github/workflows/condarise.yaml@main
    permissions:
      contents: write
    with:
      pkg_name: tidywigits
      pkg_version: ${{ needs.prep.outputs.pkg_version }}
    secrets: inherit

  dockerise:
    name: 🐳 Dockerise
    needs: [prep, condarise]
    uses: tidywf/actions/.github/workflows/dockerise.yaml@main
    permissions:
      contents: read # gh release download (fresh lockfiles)
      packages: write
    with:
      pkg_version: ${{ needs.prep.outputs.pkg_version }}

  pkgdownise:
    name: 🌐 Pkgdownise
    needs: [prep, condarise]
    uses: tidywf/actions/.github/workflows/pkgdownise.yaml@main
    permissions:
      contents: write
    with:
      pkg_name: tidywigits
      pkg_version: ${{ needs.prep.outputs.pkg_version }}
      dvc: true
      install_from_source: true
    secrets: inherit
