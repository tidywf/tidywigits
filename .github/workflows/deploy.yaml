name: conda-docker-docs

on:
  push:
    branches:
      - main
      - dev

jobs:
  condarise:
    name: 🐍 Condarise
    if: "startsWith(github.event.head_commit.message, 'Bump version:')"
    uses: tidywf/actions/.github/workflows/condarise.yaml@main
    permissions:
      contents: write
    with:
      pkg_name: tidywigits
      pkg_version: '0.0.7.9003' # bump
    secrets: inherit

  tag:
    name: 🔖 Tag
    needs: [condarise]
    uses: tidywf/actions/.github/workflows/tag.yaml@main
    permissions:
      contents: write
    with:
      pkg_version: '0.0.7.9003' # bump
    secrets: inherit

  dockerise:
    name: 🐳 Dockerise
    needs: [tag]
    uses: tidywf/actions/.github/workflows/dockerise.yaml@main
    permissions:
      packages: write
    with:
      pkg_version: '0.0.7.9003' # bump

  pkgdownise:
    name: 🌐 Pkgdownise
    needs: [tag]
    uses: tidywf/actions/.github/workflows/pkgdownise.yaml@main
    permissions:
      contents: write
    with:
      pkg_name: tidywigits
      pkg_version: '0.0.7.9003' # bump
      dvc: true
    secrets: inherit
