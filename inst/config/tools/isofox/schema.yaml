tables:
  summary:
    description: 'QC summary.'
    pattern: "\\.isf\\.summary\\.(csv|tsv)$"
    ftype: 'dsv'
    columns:
      - raw: 'SampleId'
        tidy: 'sample_id'
        type: 'char'
        description: 'sample ID'
        versions: ['latest']
      - raw: 'QcStatus'
        tidy: 'qc_status'
        type: 'char'
        description: 'QC status'
        versions: ['latest']
      - raw: 'TotalFragments'
        tidy: 'frag_tot'
        type: 'float'
        description: 'total fragments'
        versions: ['latest']
      - raw: 'DuplicateFragments'
        tidy: 'frag_dup'
        type: 'float'
        description: 'duplicate marked fragments'
        versions: ['latest']
      - raw: 'SplicedFragmentPerc'
        tidy: 'frag_spliced_pct'
        type: 'float'
        description: 'fragment % supporting 1 or more known transcripts'
        versions: ['latest']
      - raw: 'UnsplicedFragmentPerc'
        tidy: 'frag_unspliced_pct'
        type: 'float'
        description: 'fragment % not containing a splice junction and not supporting any known transcript'
        versions: ['latest']
      - raw: 'AltFragmentPerc'
        tidy: 'frag_alt_pct'
        type: 'float'
        description: 'fragment % supporting an alternate splice junction within a gene'
        versions: ['latest']
      - raw: 'ChimericFragmentPerc'
        tidy: 'frag_chimeric_pct'
        type: 'float'
        description: 'fragment % supporting a chimeric junction'
        versions: ['latest']
      - raw: 'SplicedGeneCount'
        tidy: 'spliced_gene_count'
        type: 'float'
        description: 'count of spliced genes'
        versions: ['latest']
      - raw: 'ReadLength'
        tidy: 'read_length'
        type: 'float'
        description: 'raw read length of fragments'
        versions: ['latest']
      - raw: 'FragLength5th'
        tidy: 'frag_length_5th'
        type: 'float'
        description: '5th percentile of genic intronic fragment lengths'
        versions: ['latest']
      - raw: 'FragLength50th'
        tidy: 'frag_length_50th'
        type: 'float'
        description: '50th percentile of genic intronic fragment lengths'
        versions: ['latest']
      - raw: 'FragLength95th'
        tidy: 'frag_length_95th'
        type: 'float'
        description: '95th percentile of genic intronic fragment lengths'
        versions: ['latest']
      - raw: 'EnrichedGenePercent'
        tidy: 'enriched_gene_pct'
        type: 'float'
        description: 'fragment % supporting one of the following 6 genes: RN7SL2, RN7SL1, RN7SL3, RN7SL4P, RN7SL5P & RN7SK'
        versions: ['latest']
      - raw: 'MedianGCRatio'
        tidy: 'median_gc_ratio'
        type: 'float'
        description: 'median GC ratio excluding the 6 highly enriched genes'
        versions: ['latest']
      - raw: 'ForwardStrandPercent'
        tidy: 'forward_strand_pct'
        type: 'float'
        description: 'forward strand percentage'
        versions: ['latest']
  genedata:
    description: 'Gene level data.'
    pattern: "\\.isf\\.gene_data\\.(csv|tsv)$"
    ftype: 'dsv'
    columns:
      - raw: 'GeneId'
        tidy: 'gene_id'
        type: 'char'
        description: 'Ensembl gene id'
        versions: ['v1.7.2', 'latest']
      - raw: 'GeneName'
        tidy: 'gene_name'
        type: 'char'
        description: 'gene name'
        versions: ['v1.7.2', 'latest']
      - raw: 'Chromosome'
        tidy: 'chrom'
        type: 'char'
        description: 'chromosome'
        versions: ['v1.7.2', 'latest']
      - raw: 'GeneLength'
        tidy: 'gene_length'
        type: 'int'
        description: 'length of gene'
        versions: ['v1.7.2', 'latest']
      - raw: 'IntronicLength'
        tidy: 'intronic_length'
        type: 'int'
        description: 'total bases which are intronic across all transcripts'
        versions: ['v1.7.2', 'latest']
      - raw: 'TranscriptCount'
        tidy: 'transcript_count'
        type: 'int'
        description: 'count of transcripts in gene'
        versions: ['v1.7.2', 'latest']
      - raw: 'GeneSetId'
        tidy: 'gene_set_id'
        type: 'char'
        description: 'identifier shared by all genes in overlapping group'
        versions: ['v1.7.2', 'latest']
      - raw: 'SplicedFragments'
        tidy: 'spliced_fragments'
        type: 'int'
        description: 'count of fitted fragments assigned to spliced transcripts in the gene'
        versions: ['v1.7.2', 'latest']
      - raw: 'UnsplicedFragments'
        tidy: 'unspliced_fragments'
        type: 'int'
        description: 'count of fitted fragments assigned to the unspliced gene transcript'
        versions: ['v1.7.2', 'latest']
      - raw: 'AdjTPM'
        tidy: 'tpm_adj'
        type: 'float'
        description: 'adjusted TPM'
        versions: ['v1.7.2', 'latest']
      - raw: 'RawTPM'
        tidy: 'tpm_raw'
        type: 'float'
        description: 'raw TPM'
        versions: ['v1.7.2', 'latest']
      - raw: 'FitResiduals'
        tidy: 'fit_residuals'
        type: 'float'
        description: 'fit residuals'
        versions: ['v1.7.2', 'latest']
      - raw: 'LowMapQualFrags'
        tidy: 'low_map_quality_fragments'
        type: 'float'
        description: 'low mapping quality fragments'
        versions: ['v1.7.2', 'latest']
      - raw: 'MedianTpmCancer'
        tidy: 'median_tpm_cancer'
        type: 'float'
        description: 'median tpm cancer'
        versions: ['latest']
      - raw: 'PercentileCancer'
        tidy: 'percentile_cancer'
        type: 'float'
        description: 'percentile cancer'
        versions: ['latest']
      - raw: 'MedianTpmCohort'
        tidy: 'median_tpm_cohort'
        type: 'float'
        description: 'median tpm cohort'
        versions: ['latest']
      - raw: 'PercentileCohort'
        tidy: 'percentile_cohort'
        type: 'float'
        description: 'percentile cohort'
        versions: ['latest']
      - raw: 'ReportedStatus'
        tidy: 'reported_status'
        type: 'char'
        description: 'reported status'
        versions: ['latest']
  transdata:
    description: 'Transcript level data.'
    pattern: "\\.isf\\.transcript_data\\.(csv|tsv)$"
    ftype: 'dsv'
    columns:
      - raw: 'GeneId'
        tidy: 'gene_id'
        type: 'char'
        description: 'Ensembl ID for gene'
        versions: ['latest']
      - raw: 'GeneName'
        tidy: 'gene_name'
        type: 'char'
        description: 'gene name'
        versions: ['latest']
      - raw: 'TransId'
        tidy: 'transcript_id'
        type: 'char'
        description: 'Ensembl ID for transcript'
        versions: ['latest']
      - raw: 'TransName'
        tidy: 'transcript_name'
        type: 'char'
        description: 'Ensembl transcript name'
        versions: ['latest']
      - raw: 'ExonCount'
        tidy: 'exon_count'
        type: 'int'
        description: 'count of exons in transcript'
        versions: ['latest']
      - raw: 'TranscriptLength'
        tidy: 'transcript_length'
        type: 'int'
        description: 'total length of transcript'
        versions: ['latest']
      - raw: 'EffectiveLength'
        tidy: 'effective_length'
        type: 'int'
        description: 'effective length of transcript (adjusted for fragment size)'
        versions: ['latest']
      - raw: 'FittedFragments'
        tidy: 'fitted_fragments'
        type: 'float'
        description: 'count of fragments assigned to transcript'
        versions: ['latest']
      - raw: 'RawFittedFragments'
        tidy: 'raw_fitted_fragments'
        type: 'float'
        description: 'count of fragments assigned to transcript prior to bias adjustments'
        versions: ['latest']
      - raw: 'AdjTPM'
        tidy: 'tpm_adj'
        type: 'float'
        description: 'adjusted TPM'
        versions: ['latest']
      - raw: 'RawTPM'
        tidy: 'tpm_raw'
        type: 'float'
        description: 'raw TPM'
        versions: ['latest']
      - raw: 'TranscriptBasesCovered'
        tidy: 'transcript_bases_covered'
        type: 'float'
        description: 'number of bases in transcript with at least 1 supporting fragment'
        versions: ['latest']
      - raw: 'SJSupported'
        tidy: 'sj_supported'
        type: 'float'
        description: 'count of splice junctions in transcript with at least 1 supporting fragment'
        versions: ['latest']
      - raw: 'UniqueSJSupported'
        tidy: 'sj_supported_unique'
        type: 'float'
        description: 'count of unique splice junctions in transcript with at least 1 supporting fragment'
        versions: ['latest']
      - raw: 'UniqueSJFragments'
        tidy: 'sj_fragments_unique'
        type: 'float'
        description: 'count of fragments supporting a splice junction unique to the transcript'
        versions: ['latest']
      - raw: 'UniqueNonSJFragments'
        tidy: 'non_sj_fragments_unique'
        type: 'float'
        description: 'count of fragments uniquely supporting transcript but without a unique splice junction'
        versions: ['latest']
      - raw: 'DiscordantFragments'
        tidy: 'fragments_discordant'
        type: 'float'
        description: 'discordant fragments'
        versions: ['latest']
      - raw: 'LowMapQualFrags'
        tidy: 'low_map_quality_fragments'
        type: 'float'
        description: 'low mapping quality fragments'
        versions: ['latest']
