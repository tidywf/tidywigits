  retintron:
    description: 'Retained introns.'
    pattern: "\\.isf\\.retained_intron\\.csv$"
    ftype: 'dsv'
    columns:
      - raw: 'GeneId'
        tidy: 'gene_id'
        type: 'char'
        description: 'Ensembl ID for gene'
        versions: ['latest']
      - raw: 'GeneName'
        tidy: 'gene_name'
        type: 'char'
        description: 'gene name'
        versions: ['latest']
      - raw: 'Chromosome'
        tidy: 'chrom'
        type: 'char'
        description: 'chromosome'
        versions: ['latest']
      - raw: 'Strand'
        tidy: 'strand'
        type: 'float'
        description: 'strand'
        versions: ['latest']
      - raw: 'Position'
        tidy: 'position'
        type: 'float'
        description: 'position of exon boundary with overlapping frags suggesting retained intron'
        versions: ['latest']
      - raw: 'Type'
        tidy: 'type'
        type: 'char'
        description: 'donor or acceptor splice site'
        versions: ['latest']
      - raw: 'FragCount'
        tidy: 'frag_count'
        type: 'float'
        description: 'count of all fragments which overlap splice site boundary'
        versions: ['latest']
      - raw: 'SplicedFragCount'
        tidy: 'spliced_frag_count'
        type: 'float'
        description: 'count of fragments which overlap splice site boundary which contain another splice site'
        versions: ['latest']
      - raw: 'TotalDepth'
        tidy: 'dp_total'
        type: 'float'
        description: 'depth at splice boundary'
        versions: ['latest']
      - raw: 'TranscriptInfo'
        tidy: 'transcript_info'
        type: 'char'
        description: 'transcript ID and exon rank of all transcripts that match splice site boundary'
        versions: ['latest']
  fusionsall:
    description: 'All fusions.'
    pattern: "\\.isf\\.fusions\\.(csv|tsv)$"
    ftype: 'dsv'
    columns:
      - raw: 'FusionId'
        tidy: 'fusion_id'
        type: 'char'
        description: 'fusion id'
        versions: ['v1.7.2']
      - raw: 'Valid'
        tidy: 'valid'
        type: 'char'
        description: 'valid fusion'
        versions: ['v1.7.2']
      - raw: 'ChrUp'
        tidy: 'chr_up'
        type: 'char'
        description: 'chromosome of up breakend'
        versions: ['v1.7.2']
      - raw: 'PosUp'
        tidy: 'pos_up'
        type: 'float'
        description: 'position of up breakend'
        versions: ['v1.7.2']
      - raw: 'OrientUp'
