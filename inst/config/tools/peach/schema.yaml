tables:
  events:
    description: 'Variant events.'
    pattern: "\\.peach\\.events\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'event'
        tidy: 'event'
        type: 'char'
        description: 'Event ID'
        versions: ['latest']
      - raw: 'count'
        tidy: 'count'
        type: 'float'
        description: 'Number of times event was observed'
        versions: ['latest']
  geneevents:
    description: 'Variant events linked to gene.'
    pattern: "\\.peach\\.gene\\.events\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'Gene name'
        versions: ['latest']
      - raw: 'event'
        tidy: 'event'
        type: 'char'
        description: 'ID of event linked to gene'
        versions: ['latest']
      - raw: 'count'
        tidy: 'count'
        type: 'float'
        description: 'Number of times event was observed'
        versions: ['latest']
  haplotypesall:
    description: 'All haplotypes.'
    pattern: "\\.peach\\.haplotypes\\.all\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'Gene name'
        versions: ['latest']
      - raw: 'combination'
        tidy: 'combination'
        type: 'char'
        description: 'Combination of haplotypes that could explain the observed events for this gene'
        versions: ['latest']
      - raw: 'count'
        tidy: 'count'
        type: 'float'
        description: 'Number of haplotypes in the combination'
        versions: ['latest']
      - raw: 'nonWildTypeCount'
        tidy: 'count_non_wildtype'
        type: 'float'
        description: 'Number of non-wild-type haplotypes in the combination'
        versions: ['latest']
  haplotypesbest:
    description: 'Best haplotypes.'
    pattern: "\\.peach\\.haplotypes\\.best\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'Gene name'
        versions: ['latest']
      - raw: 'haplotype'
        tidy: 'haplotype'
        type: 'char'
        description: 'Haplotype name'
        versions: ['latest']
      - raw: 'count'
        tidy: 'count'
        type: 'float'
        description: 'Number of times haplotype was called for this gene'
        versions: ['latest']
      - raw: 'function'
        tidy: 'function'
        type: 'char'
        description: 'Haplotype function'
        versions: ['latest']
      - raw: 'linkedDrugs'
        tidy: 'linked_drugs'
        type: 'char'
        description: 'List of drugs for which this gene is relevant'
        versions: ['latest']
      - raw: 'prescriptionUrls'
        tidy: 'prescription_urls'
        type: 'char'
        description: 'List of urls to prescription advice for related drugs'
        versions: ['latest']
  qc:
    description: 'QC metrics.'
    pattern: "\\.peach\\.qc\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'gene'
        tidy: 'gene'
        type: 'char'
        description: 'Gene name'
        versions: ['latest']
      - raw: 'status'
        tidy: 'status'
        type: 'char'
        description: 'QC status of calls for this gene'
        versions: ['latest']
