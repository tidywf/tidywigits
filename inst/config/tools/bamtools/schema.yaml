tables:
  wgsmetrics:
    description: 'WGS coverage metrics.'
    pattern: "\\.wgsmetrics$"
    ftype: 'txt'
    columns:
      - raw: 'GENOME_TERRITORY'
        tidy: 'genome_territory'
        type: 'float'
        description: 'number of bases in the genome'
        versions: ['latest']
      - raw: 'MEAN_COVERAGE'
        tidy: 'mean_coverage'
        type: 'float'
        description: 'mean coverage'
        versions: ['latest']
      - raw: 'SD_COVERAGE'
        tidy: 'sd_coverage'
        type: 'float'
        description: 'standard deviation of coverage'
        versions: ['latest']
      - raw: 'MEDIAN_COVERAGE'
        tidy: 'median_coverage'
        type: 'float'
        description: 'median coverage'
        versions: ['latest']
      - raw: 'MAD_COVERAGE'
        tidy: 'mad_coverage'
        type: 'float'
        description: 'median absolute deviation of coverage'
        versions: ['latest']
      - raw: 'PCT_EXC_ADAPTER'
        tidy: 'pct_exc_adapter'
        type: 'float'
        description: 'fraction of bases excluded due to adapter'
        versions: ['latest']
      - raw: 'PCT_EXC_MAPQ'
        tidy: 'pct_exc_mapq'
        type: 'float'
        description: 'fraction of bases excluded due to mapping quality'
        versions: ['latest']
      - raw: 'PCT_EXC_DUPE'
        tidy: 'pct_exc_dupe'
        type: 'float'
        description: 'fraction of bases excluded due to duplication'
        versions: ['latest']
      - raw: 'PCT_EXC_UNPAIRED'
        tidy: 'pct_exc_unpaired'
        type: 'float'
        description: 'fraction of bases excluded due to being unpaired'
        versions: ['latest']
      - raw: 'PCT_EXC_BASEQ'
        tidy: 'pct_exc_baseq'
        type: 'float'
        description: 'fraction of bases excluded due to base quality'
        versions: ['latest']
      - raw: 'PCT_EXC_OVERLAP'
        tidy: 'pct_exc_overlap'
        type: 'float'
        description: 'fraction of bases excluded due to overlap'
        versions: ['latest']
      - raw: 'PCT_EXC_CAPPED'
        tidy: 'pct_exc_capped'
        type: 'float'
        description: 'fraction of bases excluded due to capping'
        versions: ['latest']
      - raw: 'PCT_EXC_TOTAL'
        tidy: 'pct_exc_total'
        type: 'float'
        description: 'total fraction of bases excluded'
        versions: ['latest']
      - raw: 'PCT_1X'
        tidy: 'pct_1x'
        type: 'float'
        description: 'fraction of genome at 1x coverage'
        versions: ['latest']
      - raw: 'PCT_5X'
        tidy: 'pct_5x'
        type: 'float'
        description: 'fraction of genome at 5x coverage'
        versions: ['latest']
      - raw: 'PCT_10X'
        tidy: 'pct_10x'
        type: 'float'
        description: 'fraction of genome at 10x coverage'
        versions: ['latest']
      - raw: 'PCT_15X'
        tidy: 'pct_15x'
        type: 'float'
        description: 'fraction of genome at 15x coverage'
        versions: ['latest']
      - raw: 'PCT_20X'
        tidy: 'pct_20x'
        type: 'float'
        description: 'fraction of genome at 20x coverage'
        versions: ['latest']
      - raw: 'PCT_25X'
        tidy: 'pct_25x'
        type: 'float'
        description: 'fraction of genome at 25x coverage'
        versions: ['latest']
      - raw: 'PCT_30X'
        tidy: 'pct_30x'
        type: 'float'
        description: 'fraction of genome at 30x coverage'
        versions: ['latest']
      - raw: 'PCT_40X'
        tidy: 'pct_40x'
        type: 'float'
        description: 'fraction of genome at 40x coverage'
        versions: ['latest']
      - raw: 'PCT_50X'
        tidy: 'pct_50x'
        type: 'float'
        description: 'fraction of genome at 50x coverage'
        versions: ['latest']
      - raw: 'PCT_60X'
        tidy: 'pct_60x'
        type: 'float'
        description: 'fraction of genome at 60x coverage'
        versions: ['latest']
      - raw: 'PCT_70X'
        tidy: 'pct_70x'
        type: 'float'
        description: 'fraction of genome at 70x coverage'
        versions: ['latest']
      - raw: 'PCT_80X'
        tidy: 'pct_80x'
        type: 'float'
        description: 'fraction of genome at 80x coverage'
        versions: ['latest']
      - raw: 'PCT_90X'
        tidy: 'pct_90x'
        type: 'float'
        description: 'fraction of genome at 90x coverage'
        versions: ['latest']
      - raw: 'PCT_100X'
        tidy: 'pct_100x'
        type: 'float'
        description: 'fraction of genome at 100x coverage'
        versions: ['latest']
  coverage:
    description: 'Per-base coverage counts.'
    pattern: "\\.bam_metric\\.coverage\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'Coverage'
        tidy: 'coverage'
        type: 'float'
        description: 'coverage depth'
        versions: ['latest']
      - raw: 'Count'
        tidy: 'count'
        type: 'float'
        description: 'count of bases at this coverage'
        versions: ['latest']
  fraglength:
    description: 'Fragment length counts.'
    pattern: "\\.bam_metric\\.frag_length\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'FragmentLength'
        tidy: 'length'
        type: 'char'
        description: 'fragment length'
        versions: ['latest']
      - raw: 'Count'
        tidy: 'count'
        type: 'float'
        description: 'count of fragments at this length'
        versions: ['latest']
  partitionstats:
    description: 'Per-partition alignment stats.'
    pattern: "\\.bam_metric\\.partition_stats\\.tsv$"
    ftype: 'txt'
    columns:
      - raw: 'Chromosome'
        tidy: 'chrom'
        type: 'char'
        description: 'chromosome'
        versions: ['latest']
      - raw: 'PositionStart'
        tidy: 'pos_start'
        type: 'float'
        description: 'start position'
        versions: ['latest']
      - raw: 'PositionEnd'
        tidy: 'pos_end'
        type: 'float'
        description: 'end position'
        versions: ['latest']
      - raw: 'TotalReads'
        tidy: 'total_reads'
        type: 'float'
        description: 'total reads'
        versions: ['latest']
      - raw: 'DuplicateReads'
        tidy: 'dup_reads'
        type: 'float'
        description: 'duplicate reads'
        versions: ['latest']
      - raw: 'ChimericReads'
        tidy: 'chim_reads'
        type: 'float'
        description: 'chimeric reads'
        versions: ['latest']
      - raw: 'InterPartition'
        tidy: 'interpartition'
        type: 'float'
        description: 'inter-partition reads'
        versions: ['latest']
      - raw: 'UnmappedReads'
        tidy: 'unmap_reads'
        type: 'float'
        description: 'unmapped reads'
        versions: ['latest']
      - raw: 'ProcessTime'
        tidy: 'process_time'
        type: 'float'
        description: 'process time'
        versions: ['latest']
  flagstats:
    description: 'Counts of alignments for each FLAG type.'
    pattern: "\\.bam_metric\\.flag_counts\\.tsv$|\\.flagstat$"
    ftype: 'txt'
    columns:
      - raw: 'passed_or_failed'
        tidy: 'passed_or_failed'
        type: 'char'
        description: 'QC passed or failed'
        versions: ['latest']
      - raw: 'total'
        tidy: 'total'
        type: 'float'
        description: 'total number of reads that are QC pass and fail'
        versions: ['latest']
      - raw: 'primary'
        tidy: 'primary'
        type: 'float'
        description: 'neither secondary nor supplementary'
        versions: ['latest']
      - raw: 'secondary'
        tidy: 'secondary'
        type: 'float'
        description: 'secondary'
        versions: ['latest']
      - raw: 'suppl'
        tidy: 'suppl'
        type: 'float'
        description: 'supplementary'
        versions: ['latest']
      - raw: 'dup'
        tidy: 'dup'
        type: 'float'
        description: 'dup'
        versions: ['latest']
      - raw: 'primary_dup'
        tidy: 'primary_dup'
        type: 'float'
        description: 'dup and neither secondary nor supplementary'
        versions: ['latest']
      - raw: 'mapped'
        tidy: 'mapped'
        type: 'float'
        description: 'not unmap'
        versions: ['latest']
      - raw: 'primary_map'
        tidy: 'primary_map'
        type: 'float'
        description: 'not unmap, not secondary, and not supplementary'
        versions: ['latest']
      - raw: 'paired_in_seq'
        tidy: 'paired_in_seq'
        type: 'float'
        description: 'paired'
        versions: ['latest']
      - raw: 'read1'
        tidy: 'read1'
        type: 'float'
        description: 'both paired and read1'
        versions: ['latest']
      - raw: 'read2'
        tidy: 'read2'
        type: 'float'
        description: 'both paired and read2'
        versions: ['latest']
      - raw: 'proper_pair'
        tidy: 'proper_pair'
        type: 'float'
        description: 'both paired and proper_pair, not unmap'
        versions: ['latest']
      - raw: 'both_map'
        tidy: 'both_map'
        type: 'float'
        description: 'paired and neither unmap nor munmap'
        versions: ['latest']
      - raw: 'singletons'
        tidy: 'singletons'
        type: 'float'
        description: 'both paired and munmap, and not unmap'
        versions: ['latest']
      - raw: 'matemap_diff'
        tidy: 'matemap_diff'
        type: 'float'
        description: 'paired and neither unmap nor munmap, and mrnm not equal to rname'
        versions: ['latest']
      - raw: 'matemap_diff_mapq5'
        tidy: 'matemap_diff_mapq5'
        type: 'float'
        description: 'paired and neither unmap nor munmap, and mrnm not equal to rname, and mapq >= 5'
        versions: ['latest']
      - raw: 'mapped_pct'
        tidy: 'mapped_pct'
        type: 'float'
        description: 'percentage of total reads mapped'
        versions: ['latest']
      - raw: 'primary_map_pct'
        tidy: 'primary_map_pct'
        type: 'float'
        description: 'percentage of total primary reads'
        versions: ['latest']
      - raw: 'proper_pair_pct'
        tidy: 'proper_pair_pct'
        type: 'float'
        description: 'percentage against total pairs'
        versions: ['latest']
      - raw: 'singletons_pct'
        tidy: 'singletons_pct'
        type: 'float'
        description: 'percentage against total pairs'
