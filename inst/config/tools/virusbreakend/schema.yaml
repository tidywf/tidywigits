tables:
  vcfsummary:
    description: 'VIRUSBreakend analysis summary.'
    pattern: "\\.virusbreakend\\.vcf\\.summary\\.tsv$"
    ftype: 'tsv'
    columns:
      - raw: 'taxid_genus'
        tidy: 'taxid_genus'
        type: 'char'
        description: 'NCBI taxonomy ID of genus of viral reference'
        versions: ['latest']
      - raw: 'name_genus'
        tidy: 'name_genus'
        type: 'char'
        description: 'NCBI taxonomy genus name'
        versions: ['latest']
      - raw: 'reads_genus_tree'
        tidy: 'reads_genus_tree'
        type: 'int'
        description: 'Number of reads assigned to any virus in that genus by kraken2'
        versions: ['latest']
      - raw: 'taxid_species'
        tidy: 'taxid_species'
        type: 'char'
        description: 'NCBI taxonomy ID of species of viral reference'
        versions: ['latest']
      - raw: 'name_species'
        tidy: 'name_species'
        type: 'char'
        description: 'NCBI taxonomy species name'
        versions: ['latest']
      - raw: 'reads_species_tree'
        tidy: 'reads_species_tree'
        type: 'int'
        description: 'Number of reads assigned to that species (and any sub-species) by kraken2'
        versions: ['latest']
      - raw: 'taxid_assigned'
        tidy: 'taxid_assigned'
        type: 'char'
        description: 'NCBI taxonomy ID of viral reference'
        versions: ['latest']
      - raw: 'name_assigned'
        tidy: 'name_assigned'
        type: 'char'
        description: 'NCBI taxonomy name of viral reference'
        versions: ['latest']
      - raw: 'reads_assigned_tree'
        tidy: 'reads_assigned_tree'
        type: 'int'
        description: 'Number of reads assigned to the viral reference or taxonomic descendents by kraken2'
        versions: ['latest']
      - raw: 'reads_assigned_direct'
        tidy: 'reads_assigned_direct'
        type: 'int'
        description: 'Number of reads assigned to the viral reference taxid by kraken2'
        versions: ['latest']
      - raw: 'reference'
        tidy: 'reference'
        type: 'char'
        description: 'name of viral reference used'
        versions: ['latest']
      - raw: 'reference_taxid'
        tidy: 'reference_taxid'
        type: 'char'
        description: 'NCBI taxonomy ID of viral reference used'
        versions: ['latest']
      - raw: 'reference_kmer_count'
        tidy: 'reference_kmer_count'
        type: 'int'
        description: 'count of read kmers matching reference used'
        versions: ['latest']
      - raw: 'alternate_kmer_count'
        tidy: 'alternate_kmer_count'
        type: 'int'
        description: 'count of read kmers matching next best reference candidate'
        versions: ['latest']
      - raw: 'rname'
        tidy: 'rname'
        type: 'char'
        description: 'name of adjusted viral reference'
        versions: ['latest']
      - raw: 'startpos'
        tidy: 'startpos'
        type: 'int'
        description: 'start position of adjusted viral reference. Always 1'
        versions: ['latest']
      - raw: 'endpos'
        tidy: 'endpos'
        type: 'int'
        description: 'end position of adjusted viral reference'
        versions: ['latest']
      - raw: 'numreads'
        tidy: 'numreads'
        type: 'int'
        description: 'Number of reads mapped to adjusted viral reference'
        versions: ['latest']
      - raw: 'covbases'
        tidy: 'covbases'
        type: 'int'
        description: 'Number of bases with at least 1 read mapped'
        versions: ['latest']
      - raw: 'coverage'
        tidy: 'coverage'
        type: 'float'
        description: 'Percentage of viral sequence with at least one read mapped'
        versions: ['latest']
      - raw: 'meandepth'
        tidy: 'meandepth'
        type: 'float'
        description: 'Mean alignment depth'
        versions: ['latest']
      - raw: 'meanbaseq'
        tidy: 'meanbaseq'
        type: 'float'
        description: 'Mean base quality of bases mapped to adjusted viral reference'
        versions: ['latest']
      - raw: 'meanmapq'
        tidy: 'meanmapq'
        type: 'float'
        description: 'Mean mapping quality of reads mapped to adjusted viral reference'
        versions: ['latest']
      - raw: 'integrations'
        tidy: 'integrations'
        type: 'float'
        description: 'Number of integration breakpoints found'
        versions: ['latest']
      - raw: 'QCStatus'
        tidy: 'qc_status'
        type: 'char'
        description: 'QC status of viral integration'
        versions: ['latest']
